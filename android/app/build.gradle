plugins { id "com.android.application" }

android {
    namespace "com.agtstudio.liferescue"
    compileSdk 35
    defaultConfig {
        applicationId "com.agtstudio.liferescue"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }
    buildTypes { release { minifyEnabled false; proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro" } }
    sourceSets { main { assets.srcDirs = ["src/main/assets"] } }
    tasks.register("copyWebApp", Copy) {
        from("${rootDir}/../artifacts/atlas-ai/dist")
        into("${projectDir}/src/main/assets")
    }
    preBuild.dependsOn("copyWebApp")
}
dependencies { }